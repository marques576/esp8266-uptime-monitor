; Uptime Kuma-style monitor for the ESP8266 (NodeMCU)
; See README.md for wiring, flashing and the semantics of every setting.

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    dancol90/ESP8266Ping
build_flags =
    -DUM_MAX_MONITORS=12
    -DUM_FW_VERSION=\"0.2.2\"
    -Wall

; Host tests for the scheduling / retry state machine and the config codec.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DUM_MAX_MONITORS=12
    -std=gnu++17
    -Wall
